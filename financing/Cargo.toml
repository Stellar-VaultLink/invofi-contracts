[package]
name = "invofi-financing"
version = "0.7.0"
edition = "2021"
description = "Soroban financing contract for InvoFi — offers, accept, repay, reclaim"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }
invofi-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
invofi-common = { path = "../common", features = ["testutils"] }
invofi-registry = { path = "../registry" }
proptest = "1.11.0"

[features]
testutils = ["soroban-sdk/testutils", "invofi-common/testutils"]
