[package]
name = "invofi-event-indexer"
version = "0.7.0"
edition = "2021"
description = "On-chain event indexing contract for InvoFi Soroban protocol"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = { workspace = true }
invofi-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
invofi-common = { path = "../common", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils", "invofi-common/testutils"]
