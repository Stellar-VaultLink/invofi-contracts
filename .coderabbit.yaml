# CodeRabbit AI code review configuration.
# Full reference: https://docs.coderabbit.ai/reference/configuration
#
# Division of labor with the auto-merge bot (.github/workflows/auto-merge.yml):
#   - CodeRabbit does the actual code review (summary, walkthrough, line-level
#     comments) on every PR.
#   - The auto-merge bot does NOT post code reviews. It gates on CI status and
#     PR scope, waits for CodeRabbit's review check-run to complete, and then
#     merges.
language: en-US

reviews:
  # assertive: thorough reviews (the default "chill" is too light for a
  # protocol repo). The bot holds the merge until this review is done, so
  # being thorough costs nothing.
  profile: assertive
  # Keep CodeRabbit reviews non-blocking on their own: issues are reported in
  # the review, but the bot (scope gate + CI + CodeRabbit check) owns the
  # merge decision. Set to true only if you want CodeRabbit's "request
  # changes" to block merges directly.
  request_changes_workflow: false
  # High-level summary of the PR in the review comment.
  high_level_summary: true
  # No poems — keep the review professional.
  poem: false
  # Show the walkthrough expanded (not collapsed) so findings are visible.
  collapse_walkthrough: false
  # Post review-status updates (e.g. when a review is skipped).
  review_status: true
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
