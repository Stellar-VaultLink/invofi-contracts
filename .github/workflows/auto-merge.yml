name: Auto-merge bot

# Maintainer-managed bot (do NOT modify from PRs — the PR template forbids it).
#
# Behavior:
#   - Reviews every open PR: a summary review on first sight, an approving
#     review when CI is green, or a review that explains WHAT failed when a
#     required check fails (error details pulled from the check annotations
#     and the failed job's log — not just the check name).
#   - Auto-merges once all required CI checks pass: normal merge by
#     default (preserves history); rebase when the branch is behind base.
#     Never squashes — squash rewrites history and can hide changes.
#   - Triggers: PR events, an hourly sweep (catches PRs whose CI finished
#     after the event run, e.g. first-time-contributor approval gates), and
#     manual workflow_dispatch.
#
# Security: uses pull_request_target ONLY because it must act on fork PRs.
# It never checks out or executes PR code — API/gh CLI only, so the PR
# cannot influence what this workflow runs.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to process (blank = all open PRs)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

# NOTE: the `actions: write` permission above lets the bot auto-approve
# workflow runs gated behind GitHub's first-time-contributor check via
# POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve. This is what
# unlocks fork PRs from new contributors without a maintainer having to
# click "Approve and run". The schedule trigger is never gated, so the
# hourly sweep can both approve and merge.

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr || 'sweep' }}
  cancel-in-progress: false

jobs:
  bot:
    name: Review & auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GITHUB_TOKEN has repo write access on pull_request_target, so it can
      # review, approve, and merge fork PRs — no PAT needed.
      # GITHUB_TOKEN cannot approve PRs (can_approve_pull_request_reviews
      # is false), which fails contracts' branch-protection review
      # requirement. Use the maintainer PAT (CONTRIBUTORS_TOKEN) when it
      # exists — its approval counts — and fall back to GITHUB_TOKEN.
      GH_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN || secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      INPUT_PR: ${{ inputs.pr }}
      # Job names (check-run names) that must pass before auto-merge.
      REQUIRED_CHECKS: |-
        Test
        Build WASM
        Conventional Commits
        Contracts / Clippy lint
        Soroban Scout
    steps:
      # gh pr merge runs local git commands (e.g. resolving fork head
      # branches) and fails with "failed to run git" when no repo exists.
      # Check out the BASE branch only — pull_request_target context is
      # the base, never the PR head, and this bot never executes PR code.
      - name: Checkout base branch (gh merge needs a git repo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Review & auto-merge
        shell: bash
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"

          mapfile -t REQUIRED < <(printf '%s\n' "${REQUIRED_CHECKS}" | grep -v '^$')

          # Resolve which PRs to process.
          PRS=()
          if [ -n "${PR_NUMBER:-}" ]; then
            PRS+=("${PR_NUMBER}")
          elif [ -n "${INPUT_PR:-}" ]; then
            PRS+=("${INPUT_PR}")
          else
            mapfile -t PRS < <(gh pr list --repo "${REPO}" \
              --state open --limit 50 --json number --jq '.[].number')
          fi

          if [ "${#PRS[@]}" -eq 0 ]; then
            echo "No PRs to process."
            exit 0
          fi

          # GITHUB_TOKEN cannot call GET /user ("Resource not accessible
          # by integration"), so detect the actor robustly and fall back
          # to the bot identity when the token type is unknown.
          RAW_LOGIN="$(gh api user --jq .login 2>/dev/null | tr -d '\r\n' \
            || true)"
          case "${RAW_LOGIN}" in
            ""|"null") BOT_LOGIN="github-actions[bot]" ;;
            *[!a-zA-Z0-9_-]*) BOT_LOGIN="github-actions[bot]" ;;
            *) BOT_LOGIN="${RAW_LOGIN}" ;;
          esac
          echo "Bot identity: ${BOT_LOGIN}"

          # ── auto-approve gated first-time-contributor runs ──
          # Fork PRs from brand-new contributors have their workflow runs
          # held behind an approval gate (status=action_required). Approve
          # them here so CI can start without a maintainer in the loop.
          echo "── Approving pending first-time-contributor runs ──"
          mapfile -t GATED < <(gh api \
            "repos/${REPO}/actions/runs?status=action_required&per_page=50" \
            --jq '.workflow_runs[] | select(.event == "pull_request") | .id' \
            2>/dev/null || true)
          for RUN in "${GATED[@]:-}"; do
            [ -n "${RUN}" ] || continue
            if gh api -X POST \
              "repos/${REPO}/actions/runs/${RUN}/approve" >/dev/null 2>&1; then
              echo "  ✅ approved gated run ${RUN}"
            else
              echo "  could not approve run ${RUN} (may already be approved)"
            fi
          done

          # Build a per-check failure summary: annotations first (what the
          # checks UI shows), then error lines from the failed job's log.
          failure_report() {
            local SHA="$1"
            local OUT="" NAME ID CONC URL R RUN_ID JOB_ID
            local CHECK_JSON ANN ERRS
            CHECK_JSON="$(gh api "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '.check_runs[] | select(.conclusion != null)
                | select(.conclusion != "success")
                | select(.conclusion != "neutral")
                | select(.conclusion != "skipped")
                | [.name, (.id|tostring), .conclusion, (.details_url // "")]
                | @tsv' 2>/dev/null || true)"
            while IFS=$'\t' read -r NAME ID CONC URL; do
              [ -n "${NAME}" ] || continue
              NEEDED=false
              for R in "${REQUIRED[@]}"; do
                [ "${R}" = "${NAME}" ] && NEEDED=true
              done
              [ "${NEEDED}" = "true" ] || continue
              OUT+="* **${NAME}** (\`${CONC}\`)"
              ANN="$(gh api "repos/${REPO}/check-runs/${ID}/annotations" \
                --jq '[.[] | select(.level == "failure")
                  | "- " + (.title // "") + " — " + (.message // "")]
                  | .[:5] | join("\n")' 2>/dev/null | cut -c1-250 || true)"
              if [ -n "${ANN}" ]; then
                OUT+=$'\n'"${ANN}"
              else
                RUN_ID="$(printf '%s' "${URL}" \
                  | sed -n 's#.*/runs/\([0-9][0-9]*\).*#\1#p')"
                if [ -n "${RUN_ID}" ]; then
                  JOB_ID="$(gh api \
                    "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
                    --jq '.jobs[] | select(.conclusion != "success")
                      | .id' 2>/dev/null | head -1 || true)"
                  if [ -n "${JOB_ID}" ]; then
                    ERRS="$(gh api \
                      "repos/${REPO}/actions/jobs/${JOB_ID}/logs" \
                      2>/dev/null \
                      | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z[[:space:]]*//' \
                      | grep -aiE 'error|failed|panic|✖|✗|⧗|FAILED' \
                      | grep -aviE 'runner|watchdog|cleanup|post job' \
                      | grep -aviE 'process-completion|docker run|failOnErrors|INPUT_' \
                      | sed -e 's/##\[error\]/❌ /' -e 's/##\[warning\]/⚠️ /' \
                      | head -8 | sed 's/^/  /' | cut -c1-250 || true)"
                    if [ -n "${ERRS}" ]; then
                      OUT+=$'\n'"${ERRS}"
                    else
                      OUT+=$'\n'"  (no details — see the check log)"
                    fi
                  fi
                fi
              fi
              OUT+=$'\n'
            done <<< "${CHECK_JSON}"
            printf '%s' "${OUT}"
          }

          for PR in "${PRS[@]}"; do
            echo "── PR #${PR} ──"

            META="$(gh pr view "${PR}" --repo "${REPO}" \
              --json state,isDraft,mergeable,headRefOid,author \
              --jq '{state,isDraft,mergeable,headRefOid,author:.author.login}' \
              2>/dev/null || true)"
            [ -n "${META}" ] || { echo "  cannot read PR — skip"; continue; }

            STATE="$(printf '%s' "${META}" | jq -r .state)"
            DRAFT="$(printf '%s' "${META}" | jq -r .isDraft)"
            MERGEABLE="$(printf '%s' "${META}" | jq -r .mergeable)"
            SHA="$(printf '%s' "${META}" | jq -r .headRefOid)"
            AUTHOR="$(printf '%s' "${META}" | jq -r .author)"

            [ "${STATE}" = "OPEN" ] || { echo "  skip (state=${STATE})"; continue; }
            [ "${DRAFT}" = "false" ] || { echo "  skip (draft)"; continue; }

            SELF=false
            [ "${AUTHOR}" = "${BOT_LOGIN}" ] && SELF=true

            # ── initial summary review (once per head sha) ──
            EXISTING="$(gh pr view "${PR}" --repo "${REPO}" \
              --json reviews \
              --jq "[.reviews[] | select(.author.login == \"${BOT_LOGIN}\")
                | select(.commit.oid == \"${SHA}\")] | length" \
              2>/dev/null || echo 0)"
            if [ "${EXISTING}" -eq 0 ] && [ "${SELF}" != "true" ]; then
              SUMMARY="$(gh pr view "${PR}" --repo "${REPO}" \
                --json title,changedFiles,additions,deletions \
                --jq '\"`\" + .title + \"` — +\" + (.additions|tostring)
                  + \"/−\" + (.deletions|tostring) + \" across \"
                  + (.changedFiles|tostring) + \" file(s).\"' \
                2>/dev/null || echo "PR #${PR}")"
              BODY="🤖 **Bot review** — ${SUMMARY}"
              BODY+=$'\n\n'
              BODY+="I will approve and merge this PR automatically once all"
              BODY+=" required CI checks pass."
              BODY+=$'\n'
              BODY+="If a required check fails, I'll leave a note here for you"
              BODY+=" to fix."
              gh pr review "${PR}" --repo "${REPO}" --comment \
                --body "${BODY}" 2>/dev/null || true
            fi

            # ── wait for required checks (up to ~40 min) ──
            DEADLINE=$(( $(date +%s) + 2400 ))
            OUTCOME="pending"
            FAILED=""
            while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
              declare -A CONCS=()
              while IFS=$'\t' read -r NAME CONC; do
                [ -n "${NAME}" ] || continue
                CONCS["${NAME}"]="${CONC}"
              done < <(gh pr view "${PR}" --repo "${REPO}" \
                --json statusCheckRollup \
                --jq '.statusCheckRollup[] | [((.name // .context)),
                  ((.conclusion // .state))] | @tsv' 2>/dev/null || true)

              FAILED=""
              PENDING=false
              for R in "${REQUIRED[@]}"; do
                C="${CONCS[${R}]:-}"
                case "${C}" in
                  SUCCESS|NEUTRAL|SKIPPED) ;;
                  FAILURE|CANCELLED|TIMED_OUT|ACTION_REQUIRED|STARTUP_FAILURE)
                    FAILED="${FAILED} ${R} (${C})" ;;
                  *) PENDING=true ;;
                esac
              done

              if [ -n "${FAILED}" ]; then OUTCOME="fail"; break; fi
              if [ "${PENDING}" = "false" ]; then OUTCOME="pass"; break; fi
              sleep 30
            done

            if [ "${OUTCOME}" = "pending" ]; then
              echo "  required checks still running — leaving for a later run"
              continue
            fi

            if [ "${OUTCOME}" = "fail" ]; then
              echo "  FAILED:${FAILED}"
              MARKER="<!-- BOT-FAIL-REPORT sha=${SHA} -->"
              ALREADY="$(gh pr view "${PR}" --repo "${REPO}" \
                --json reviews \
                --jq "[.reviews[] | select(.author.login == \"${BOT_LOGIN}\")
                  | select(.body | contains(\"${MARKER}\"))] | length" \
                2>/dev/null || echo 0)"
              if [ "${ALREADY}" -eq 0 ]; then
                REPORT="$(failure_report "${SHA}")"
                if [ -z "${REPORT}" ]; then REPORT="${FAILED}"; fi
                BODY="🤖 **Bot review** — ❌ CI failed. What broke:"
                BODY+=$'\n\n'
                BODY+="${REPORT}"
                BODY+=$'\n\n'
                BODY+="${MARKER}"
                BODY+=$'\n'
                BODY+="Please fix and push — I will re-check automatically."
                gh pr review "${PR}" --repo "${REPO}" --comment \
                  --body "${BODY}" 2>/dev/null || true
              fi
              continue
            fi

            # ── all required checks passed → announce, approve, merge ──
            echo "  all required checks passed"
            [ "${MERGEABLE}" = "MERGEABLE" ] || {
              echo "  not mergeable (${MERGEABLE}) — will retry"; continue; }

            # Announce the merge with a plain review comment first — this
            # works even when the token cannot submit APPROVED reviews.
            ANNOUNCE="$(gh pr view "${PR}" --repo "${REPO}" \
              --json reviews \
              --jq "[.reviews[] | select(.author.login == \"${BOT_LOGIN}\")
                | select(.body | contains(\"BOT-MERGE-ANNOUNCE ${SHA}\"))]
                | length" 2>/dev/null || echo 0)"
            if [ "${ANNOUNCE}" -eq 0 ] && [ "${SELF}" != "true" ]; then
              BODY="🤖 **Bot review** — ✅ All required CI checks passed."
              BODY+=$'\n'
              BODY+="Merging now."
              BODY+=$'\n\n'
              BODY+="<!-- BOT-MERGE-ANNOUNCE ${SHA} -->"
              gh pr review "${PR}" --repo "${REPO}" --comment \
                --body "${BODY}" 2>/dev/null || true
            fi

            APPROVED="$(gh pr view "${PR}" --repo "${REPO}" \
              --json reviews \
              --jq "[.reviews[] | select(.author.login == \"${BOT_LOGIN}\")
                | select(.commit.oid == \"${SHA}\")
                | select(.state == \"APPROVED\")] | length" \
              2>/dev/null || echo 0)"
            if [ "${APPROVED}" -eq 0 ] && [ "${SELF}" != "true" ]; then
              gh pr review "${PR}" --repo "${REPO}" --approve \
                --body "🤖 Approved — all required CI checks passed." \
                2>/dev/null || true
            fi

            # Merge strategy: normal merge by default (keeps history). If
            # the branch is behind the base and a clean merge is not
            # possible, rebase instead. Never squash — it rewrites history.
            if MERGE_OUT="$(gh pr merge "${PR}" --repo "${REPO}" \
              --merge 2>&1)"; then
              echo "  ✅ merged #${PR}"
              if [ "${SELF}" != "true" ]; then
                gh pr comment "${PR}" --repo "${REPO}" \
                  --body "🎉 Merged — thanks for the contribution!" \
                  2>/dev/null || true
              fi
            elif MERGE_OUT="$(gh pr merge "${PR}" --repo "${REPO}" \
              --rebase 2>&1)"; then
              echo "  ✅ rebased and merged #${PR}"
              if [ "${SELF}" != "true" ]; then
                gh pr comment "${PR}" --repo "${REPO}" \
                  --body "🎉 Merged — thanks for the contribution!" \
                  2>/dev/null || true
              fi
            else
              MERGE_ERR="$(printf '%s' "${MERGE_OUT}" \
                | head -3 | tr '\n' ' ')"
              [ -n "${MERGE_ERR}" ] || MERGE_ERR="(no error output)"
              MARKER2="<!-- BOT-MERGE-FAIL sha=${SHA} -->"
              ALREADY2="$(gh pr view "${PR}" --repo "${REPO}" \
                --json reviews \
                --jq "[.reviews[] | select(.author.login == \"${BOT_LOGIN}\")
                  | select(.body | contains(\"${MARKER2}\"))] | length" \
                2>/dev/null || echo 0)"
              if [ "${ALREADY2}" -eq 0 ]; then
                BODY="🤖 **Bot review** — CI is green but the merge failed:"
                BODY+=$'\n\n'
                BODY+="> ${MERGE_ERR}"
                BODY+=$'\n\n'
                BODY+="${MARKER2}"
                BODY+=$'\n'
                BODY+="A maintainer will handle it."
                gh pr review "${PR}" --repo "${REPO}" --comment \
                  --body "${BODY}" 2>/dev/null || true
              fi
            fi
          done
