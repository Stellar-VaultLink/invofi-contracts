name: Deploy Contracts to Testnet

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: testnet
        type: choice
        options:
          - testnet

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy Soroban Contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli

      - name: Configure deployer identity
        env:
          DEPLOYER_SECRET_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET_KEY }}
        run: |
          if [ -z "$DEPLOYER_SECRET_KEY" ]; then
            echo "::notice::STELLAR_DEPLOYER_SECRET_KEY not set — generating a fresh keypair for this run."
            stellar keys generate invofi-deployer --network ${{ inputs.network }}
          else
            # stellar-cli 23 only accepts keys via interactive prompts (not
            # usable in CI), so write the identity file directly — the exact
            # format `stellar keys generate` produces. The secret may be a
            # 24-word mnemonic or an S... secret key.
            mkdir -p "$HOME/.config/stellar/identity"
            printf 'seed_phrase = "%s"\n' "$DEPLOYER_SECRET_KEY" > "$HOME/.config/stellar/identity/invofi-deployer.toml"
          fi

      - name: Fund deployer via Friendbot
        run: stellar keys fund invofi-deployer --network ${{ inputs.network }}

      - name: Build WASM
        run: stellar contract build

      - name: Deploy contracts with constructor-bound admin
        id: deploy
        run: |
          ADMIN_PUBLIC=$(stellar keys address invofi-deployer --network ${{ inputs.network }})
          echo "admin_public=$ADMIN_PUBLIC" >> "$GITHUB_OUTPUT"

          # Constructors (issue #75): admin + wiring are bound atomically inside
          # the deploy operation, which only the deployer can authorize. There is
          # no separate initialize() call a third party could front-run. Deploy
          # in dependency order — financing/repayment reference earlier IDs.
          XLM_TOKEN=$(stellar contract id asset --asset native --network ${{ inputs.network }})
          USDC_TOKEN=$(stellar contract id asset --asset USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 --network ${{ inputs.network }})

          REGISTRY_ID=$(stellar contract deploy --wasm target/wasm32v1-none/release/invofi_registry.wasm --source invofi-deployer --network ${{ inputs.network }} -- --admin "$ADMIN_PUBLIC")
          FINANCING_ID=$(stellar contract deploy --wasm target/wasm32v1-none/release/invofi_financing.wasm --source invofi-deployer --network ${{ inputs.network }} -- --admin "$ADMIN_PUBLIC" --registry "$REGISTRY_ID" --token "$XLM_TOKEN")
          REPAYMENT_ID=$(stellar contract deploy --wasm target/wasm32v1-none/release/invofi_repayment.wasm --source invofi-deployer --network ${{ inputs.network }} -- --admin "$ADMIN_PUBLIC" --registry "$REGISTRY_ID" --financing "$FINANCING_ID" --token "$XLM_TOKEN")
          INSURANCE_ID=$(stellar contract deploy --wasm target/wasm32v1-none/release/invofi_insurance.wasm --source invofi-deployer --network ${{ inputs.network }} -- --admin "$ADMIN_PUBLIC" --token "$XLM_TOKEN")
          REPUTATION_ID=$(stellar contract deploy --wasm target/wasm32v1-none/release/invofi_reputation.wasm --source invofi-deployer --network ${{ inputs.network }} -- --admin "$ADMIN_PUBLIC")

          echo "registry_id=$REGISTRY_ID" >> "$GITHUB_OUTPUT"
          echo "financing_id=$FINANCING_ID" >> "$GITHUB_OUTPUT"
          echo "repayment_id=$REPAYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "insurance_id=$INSURANCE_ID" >> "$GITHUB_OUTPUT"
          echo "reputation_id=$REPUTATION_ID" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<OUTEOF
          ## Deployed contracts (testnet)

          | Contract | ID |
          | --- | --- |
          | registry | \`$REGISTRY_ID\` |
          | financing | \`$FINANCING_ID\` |
          | repayment | \`$REPAYMENT_ID\` |
          | insurance | \`$INSURANCE_ID\` |
          | reputation | \`$REPUTATION_ID\` |
          | position token (POS) | deployed + admin'ed to financing in the next step |
          | admin (constructor-bound) | \`$ADMIN_PUBLIC\` |

          Set these in Vercel:
          - NEXT_PUBLIC_REGISTRY_CONTRACT_ID
          - NEXT_PUBLIC_FINANCING_CONTRACT_ID
          - NEXT_PUBLIC_REPAYMENT_CONTRACT_ID
          OUTEOF

      - name: Wire cross-contract callers and currencies
        env:
          REGISTRY_ID: ${{ steps.deploy.outputs.registry_id }}
          FINANCING_ID: ${{ steps.deploy.outputs.financing_id }}
          REPAYMENT_ID: ${{ steps.deploy.outputs.repayment_id }}
          INSURANCE_ID: ${{ steps.deploy.outputs.insurance_id }}
          REPUTATION_ID: ${{ steps.deploy.outputs.reputation_id }}
        run: |
          ADMIN_PUBLIC=${{ steps.deploy.outputs.admin_public }}
          XLM_TOKEN=$(stellar contract id asset --asset native --network ${{ inputs.network }})
          USDC_TOKEN=$(stellar contract id asset --asset USDC:GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 --network ${{ inputs.network }})

          # No initialize() calls: constructors already bound admin/wiring at
          # deploy. Only the admin-gated cross-contract wiring remains.

          stellar contract invoke --id "$REGISTRY_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_financing_contract --admin "$ADMIN_PUBLIC" --financing "$FINANCING_ID"
          stellar contract invoke --id "$REGISTRY_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_repayment_contract --admin "$ADMIN_PUBLIC" --repayment "$REPAYMENT_ID"
          stellar contract invoke --id "$FINANCING_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_repayment_contract --admin "$ADMIN_PUBLIC" --repayment "$REPAYMENT_ID"
          stellar contract invoke --id "$FINANCING_ID" --source invofi-deployer --network ${{ inputs.network }} -- register_currency --admin "$ADMIN_PUBLIC" --currency XLM --token_addr "$XLM_TOKEN"
          stellar contract invoke --id "$FINANCING_ID" --source invofi-deployer --network ${{ inputs.network }} -- register_currency --admin "$ADMIN_PUBLIC" --currency USDC --token_addr "$USDC_TOKEN"

          # Position token: POS is deterministic per issuer, so compute its ID and
          # only deploy if missing (a re-run with the same deployer reuses the
          # already-deployed SAC instead of failing with "contract already exists").
          POS_ID=$(stellar contract id asset --asset "POS:$ADMIN_PUBLIC" --network ${{ inputs.network }})
          if ! stellar contract info interface --id "$POS_ID" --network ${{ inputs.network }} >/dev/null 2>&1; then
            stellar contract asset deploy --asset "POS:$ADMIN_PUBLIC" --source invofi-deployer --network ${{ inputs.network }}
          fi
          # Hand POS admin to the financing contract. On a re-run this is a no-op
          # only when the deployer still owns the SAC; if a previous run handed it
          # to an older financing contract, the step fails loudly with a clear
          # message rather than silently minting from the wrong admin.
          stellar contract invoke --id "$POS_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_admin --new_admin "$FINANCING_ID"
          stellar contract invoke --id "$FINANCING_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_position_token --admin "$ADMIN_PUBLIC" --token "$POS_ID"

          # Insurance payout caller + reputation recorder: repayment is the only
          # authorized caller on both.
          stellar contract invoke --id "$REPAYMENT_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_insurance --admin "$ADMIN_PUBLIC" --insurance "$INSURANCE_ID"
          stellar contract invoke --id "$REPAYMENT_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_reputation --admin "$ADMIN_PUBLIC" --reputation "$REPUTATION_ID"
          stellar contract invoke --id "$INSURANCE_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_payout_caller --admin "$ADMIN_PUBLIC" --payout_caller "$REPAYMENT_ID"
          stellar contract invoke --id "$REPUTATION_ID" --source invofi-deployer --network ${{ inputs.network }} -- set_recorder --admin "$ADMIN_PUBLIC" --recorder "$REPAYMENT_ID"

          echo "position_token_id=$POS_ID" >> "$GITHUB_OUTPUT"
          echo "position_token=$POS_ID" >> "$GITHUB_STEP_SUMMARY"
