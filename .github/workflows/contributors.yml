name: Contributors

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  contrib-readme-job:
    runs-on: ubuntu-latest
    name: A job to automate contrib in readme
    steps:
      - uses: actions/checkout@v7
      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image_size: 100
          columns_per_row: 6
          readme_path: README.md
          commit_message: 'docs(contributor): update contributors list'
          pr_title_on_protected: 'docs(contributor): update contributors list'
