name: Contributors

on:
  push:
    branches:
      - master
  schedule:
    # Weekly retry: GitHub's contributor-stats cache lags new merges by up to
    # a few days, so the push-triggered run right after a merge can miss a
    # contributor (see the RawNuke catch-up on 2026-08-14). This run
    # re-syncs the table once the cache has caught up, even with no new push.
    # Wednesday 09:00 UTC — deliberately offset from the Monday token watchdog.
    - cron: '0 9 * * 3'
  workflow_dispatch:

# Serialize runs: the bot rewrites the same README section, so a scheduled run
# and a push-triggered run must never race each other.
concurrency:
  group: contributors-readme
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  contrib-readme-job:
    runs-on: ubuntu-latest
    name: A job to automate contrib in readme
    steps:
      - uses: actions/checkout@v7
      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN }}
        with:
          image_size: 100
          columns_per_row: 6
          readme_path: README.md
          commit_message: 'docs(contributor): update contributors list'
          auto_detect_branch_protection: false
